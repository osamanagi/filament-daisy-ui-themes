name: tests
# Package tests are cheap, so keep them on pull requests, on the default branch,
# and on demand. Feature-branch pushes skip the duplicate run that the pull
# request already produces.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned floors: the oldest Filament 4 and 5 releases the package allows.
          - {
              php: '8.2',
              laravel: '11.*',
              testbench: '9.*',
              filament: '4.0.0',
              livewire: '3.8.9',
            }
          - {
              php: '8.2',
              laravel: '11.*',
              testbench: '9.*',
              filament: '5.0.0',
              livewire: '4.4.6',
            }
          # Floating lanes: the newest release of each major.
          - {
              php: '8.3',
              laravel: '12.*',
              testbench: '10.*',
              filament: '^4.0',
              livewire: '^3.8.9',
            }
          - {
              php: '8.3',
              laravel: '12.*',
              testbench: '10.*',
              filament: '^5.0',
              livewire: '^4.4.6',
            }
          - {
              php: '8.4',
              laravel: '13.*',
              testbench: '11.*',
              filament: '^4.0',
              livewire: '^3.8.9',
            }
          - {
              php: '8.4',
              laravel: '13.*',
              testbench: '11.*',
              filament: '^5.0',
              livewire: '^4.4.6',
            }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, zip, gd
          coverage: pcov
      - name: Resolve the compatibility lane
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          FILAMENT: ${{ matrix.filament }}
          LIVEWIRE: ${{ matrix.livewire }}
        run: |
          # The pinned floor lanes install the oldest supported Filament
          # releases (4.0.0 / 5.0.0) to prove the plugin's API guard. Composer
          # 2.10 refuses those upstream versions by default because of Filament
          # security advisories this package is not affected by, so the block is
          # lifted for this disposable resolution only.
          composer config policy.advisories.block false --no-interaction
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" "filament/filament:$FILAMENT" "livewire/livewire:$LIVEWIRE" --no-update --no-interaction
          composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest --ci
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pint --test
