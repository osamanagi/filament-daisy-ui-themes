name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              php: '8.2',
              laravel: '11.*',
              testbench: '9.*',
              filament: '4.14.0',
              livewire: '3.8.9',
            }
          - {
              php: '8.2',
              laravel: '11.*',
              testbench: '9.*',
              filament: '5.9.0',
              livewire: '4.4.6',
            }
          - {
              php: '8.3',
              laravel: '12.*',
              testbench: '10.*',
              filament: '^4.14',
              livewire: '^3.8.9',
            }
          - {
              php: '8.3',
              laravel: '12.*',
              testbench: '10.*',
              filament: '^5.9',
              livewire: '^4.4.6',
            }
          - {
              php: '8.4',
              laravel: '13.*',
              testbench: '11.*',
              filament: '^4.14',
              livewire: '^3.8.9',
            }
          - {
              php: '8.4',
              laravel: '13.*',
              testbench: '11.*',
              filament: '^5.9',
              livewire: '^4.4.6',
            }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, zip, gd
          coverage: none
      - name: Resolve the compatibility lane
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          FILAMENT: ${{ matrix.filament }}
          LIVEWIRE: ${{ matrix.livewire }}
        run: |
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" "filament/filament:$FILAMENT" "livewire/livewire:$LIVEWIRE" --no-update --no-interaction
          composer update --prefer-dist --no-interaction
      - run: vendor/bin/pest --ci
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/pint --test
